<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">NerdLore</title>
  <desc id="d">NerdLore: Hacker News' best video picks, ranked by trust, not views.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e17"/><stop offset="1" stop-color="#121628"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#3dd6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0e17" stop-opacity="1"/><stop offset=".55" stop-color="#0b0e17" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#grid)"/>

  <!-- right side: a little zone map, HN dots (orange) and YouTube dots (cyan), gems glowing violet -->
  <g opacity=".95" transform="translate(40 0)">
    <line x1="760" y1="170" x2="1240" y2="170" stroke="#ffffff" stroke-opacity=".16" stroke-dasharray="5 7"/>
    <line x1="960" y1="40" x2="960" y2="300" stroke="#ffffff" stroke-opacity=".16" stroke-dasharray="5 7"/>
    <rect x="760" y="40" width="200" height="130" fill="#a78bfa" fill-opacity=".09"/>
    <text x="772" y="62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2" fill="#a78bfa">HIDDEN GEMS</text>
    <text x="1190" y="62" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2" fill="#ffcf6e" fill-opacity=".8">SHARED CLASSICS</text>
    <text x="1190" y="290" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2" fill="#3dd6ff" fill-opacity=".8">CROWD HITS</text>
    <g fill="#ffcf6e" fill-opacity=".85">
      <circle cx="1000" cy="92" r="3"/><circle cx="1030" cy="130" r="3"/><circle cx="1062" cy="104" r="3"/><circle cx="1090" cy="146" r="3"/>
      <circle cx="1120" cy="84" r="3"/><circle cx="1148" cy="122" r="3"/><circle cx="1178" cy="98" r="3"/><circle cx="1012" cy="154" r="3"/>
      <circle cx="1205" cy="140" r="3"/><circle cx="1070" cy="70" r="3"/>
    </g>
    <g fill="#3dd6ff" fill-opacity=".8">
      <circle cx="985" cy="200" r="3"/><circle cx="1010" cy="236" r="3"/><circle cx="1040" cy="214" r="3"/><circle cx="1066" cy="262" r="3"/>
      <circle cx="1094" cy="196" r="3"/><circle cx="1118" cy="240" r="3"/><circle cx="1146" cy="210" r="3"/><circle cx="1172" cy="252" r="3"/>
      <circle cx="1200" cy="224" r="3"/><circle cx="1024" cy="280" r="3"/><circle cx="1086" cy="228" r="3"/><circle cx="1160" cy="186" r="3"/>
    </g>
    <g fill="#8b93a7" fill-opacity=".55">
      <circle cx="800" cy="240" r="2.6"/><circle cx="836" cy="268" r="2.6"/><circle cx="872" cy="214" r="2.6"/><circle cx="910" cy="256" r="2.6"/><circle cx="940" cy="226" r="2.6"/>
    </g>
    <g>
      <circle cx="812" cy="104" r="16" fill="url(#glow)"/><circle cx="812" cy="104" r="4.5" fill="#c4b5fd"/>
      <circle cx="868" cy="132" r="16" fill="url(#glow)"/><circle cx="868" cy="132" r="4.5" fill="#c4b5fd"/>
      <circle cx="914" cy="88" r="16" fill="url(#glow)"/><circle cx="914" cy="88" r="4.5" fill="#c4b5fd"/>
      <circle cx="846" cy="76" r="12" fill="url(#glow)"/><circle cx="846" cy="76" r="3.5" fill="#c4b5fd"/>
    </g>
    <text x="1198" y="322" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#8b93a7">YOUTUBE VIEWS →</text>
    <text x="748" y="300" transform="rotate(-90 748 300)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#8b93a7">HN RECOMMENDERS →</text>
  </g>
  <rect x="680" y="0" width="420" height="340" fill="url(#fadeR)"/>

  <!-- left: logo + words -->
  <circle cx="122" cy="150" r="70" fill="url(#glow)"/>
  <rect x="78" y="106" width="88" height="88" rx="22" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M96 140 L108 122 L136 122 L148 140 L122 176 Z" fill="url(#gem)"/>
  <path d="M96 140 H148 M108 122 L122 176 L136 122" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.4" stroke-linejoin="round"/>

  <text x="196" y="122" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="3.5" fill="#a78bfa">HN MEMORY × YOUTUBE REACH</text>
  <text x="192" y="190" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-1.5" fill="#f4f6fb">Nerd<tspan fill="#ff7a3d">Lore</tspan></text>
  <text x="196" y="236" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="21" fill="#c9cfdd">Hacker News’ best video picks, ranked by trust, not views.</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="1">
    <rect x="196" y="262" width="150" height="30" rx="15" fill="#ff7a3d" fill-opacity=".12" stroke="#ff7a3d" stroke-opacity=".5"/>
    <text x="271" y="282" text-anchor="middle" fill="#ffb08a">HN RECOMMENDS</text>
    <rect x="356" y="262" width="150" height="30" rx="15" fill="#3dd6ff" fill-opacity=".10" stroke="#3dd6ff" stroke-opacity=".5"/>
    <text x="431" y="282" text-anchor="middle" fill="#9be9ff">YOUTUBE VIEWS</text>
    <rect x="516" y="262" width="130" height="30" rx="15" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".55"/>
    <text x="581" y="282" text-anchor="middle" fill="#d6ccff">= GEMS</text>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- "HN's inside jokes" browser. charts.jokes_html fills __DATA__ with HackerTube data only: the clips HN posts as a
     joke, HackerTube's LLM-written note on the joke, joke posts per year, and example HN threads. -->
<style>
  :root { --text: #e6edf3; --muted: #8b949e; --line: rgba(255, 255, 255, .08); --panel: rgba(255, 255, 255, .03);
          --panel2: rgba(255, 255, 255, .055); --hn: #ff7a3d; --yt: #3dd6ff; --gem: #a78bfa; --joke: #f5c542; }
  body.light { --text: #1f2328; --muted: #57606a; --line: rgba(0, 0, 0, .09); --panel: rgba(0, 0, 0, .025);
               --panel2: rgba(0, 0, 0, .045); --hn: #e8590c; --yt: #0891b2; --gem: #7c3aed; --joke: #b7791f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 14px/1.45 "Source Sans Pro", "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }

  .wrap { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.35fr); gap: 16px; align-items: start; }
  .list { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 8px; }
  .lh { display: flex; justify-content: space-between; padding: 4px 8px 8px; font-size: 10.5px; color: var(--muted); }
  .row { width: 100%; display: grid; grid-template-columns: 88px minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 6px;
         border: 0; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; transition: background .2s; animation: rise .45s both; }
  .row:hover { background: var(--panel2); }
  .row.on { background: color-mix(in srgb, var(--joke) 11%, transparent); box-shadow: inset 3px 0 0 var(--joke); }
  .row .th { aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #000; }
  .row img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row .t { font-weight: 600; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .n { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .row .n b { color: var(--joke); }
  .row svg { width: 64px; height: 26px; display: block; }

  .detail { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 16px; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; animation: rise .45s both; }
  .shot { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000;
          box-shadow: 0 0 0 1px color-mix(in srgb, var(--joke) 50%, transparent), 0 16px 36px -18px var(--joke); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
  .shot:hover img { transform: scale(1.03); }
  .shot .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .2s; background: radial-gradient(circle, rgba(0,0,0,.35), transparent 60%); }
  .shot:hover .play { opacity: 1; }
  .shot .play span { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.5); color: #fff; font-size: 20px; }
  .rank { font-size: 11px; color: var(--joke); }
  .hero h2 { font-size: 21px; line-height: 1.2; margin: 4px 0 2px; }
  .hero .c { color: var(--muted); font-size: 13px; }
  .count { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .count b { font-size: 34px; line-height: 1; color: var(--joke); font-variant-numeric: tabular-nums; text-shadow: 0 0 22px color-mix(in srgb, var(--joke) 45%, transparent); }
  .count span { color: var(--muted); font-size: 12.5px; }
  .ai { margin-top: 12px; padding: 9px 11px; border-radius: 9px; border: 1px dashed color-mix(in srgb, var(--joke) 50%, transparent);
        background: color-mix(in srgb, var(--joke) 7%, transparent); font-size: 13.5px; }
  .ai .k { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--joke); margin-bottom: 2px; }
  .ai .k svg { width: 12px; height: 12px; }
  .sect { font-size: 10.5px; color: var(--muted); margin: 16px 0 6px; display: flex; justify-content: space-between; }
  .yrs { display: flex; align-items: flex-end; gap: 4px; height: 86px; padding-bottom: 18px; position: relative; }
  .yr { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; }
  .yr i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--joke), color-mix(in srgb, var(--joke) 25%, transparent));
          height: 0; transition: height .8s cubic-bezier(.2, .7, .2, 1); }
  .yr span { position: absolute; bottom: -17px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .yr em { position: absolute; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--joke); opacity: 0; transition: opacity .2s; }
  .yr:hover em { opacity: 1; }
  .feed { display: grid; gap: 10px; }
  .msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; animation: pop .4s both; }
  .msg .ava { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 20px; line-height: 1; padding-top: 6px;
              color: var(--joke); background: color-mix(in srgb, var(--joke) 14%, transparent); border: 1px solid color-mix(in srgb, var(--joke) 45%, transparent); }
  .bubble { padding: 8px 12px; border-radius: 4px 12px 12px 12px; background: var(--panel2); border: 1px solid var(--line); }
  .bubble .ctx { font-size: 11.5px; color: var(--muted); }
  .bubble .ctx b { color: var(--text); font-weight: 600; }
  .bubble .q { margin-top: 3px; }
  .bubble .q.none { color: var(--muted); font-style: italic; }
  .bubble a { font-size: 12px; color: var(--hn); text-decoration: none; display: inline-block; margin-top: 4px; }
  .bubble a:hover { text-decoration: underline; }
  @media (max-width: 860px) { .wrap, .hero { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="list" role="listbox" aria-label="Inside jokes">
    <div class="lh mono"><span>CLIP · TIMES POSTED AS A JOKE</span><span>BY YEAR</span></div>
    <div id="rows"></div>
  </div>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>
<script>
(() => {
  const D = __DATA__;
  try {
    const app = parent.document.querySelector(".stApp") || parent.document.body;
    const [r, g, b] = getComputedStyle(app).backgroundColor.match(/\d+/g).map(Number);
    document.body.classList.toggle("light", 0.299 * r + 0.587 * g + 0.114 * b > 140);
  } catch (e) {}
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const SVG = "http://www.w3.org/2000/svg";
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const when = m => { const [y, mo] = (m || "").split("-"); return mo ? `${MONTHS[+mo - 1]} ${y}` : y || ""; };
  const allYears = D.jokes.flatMap(j => Object.keys(j.years).map(Number));
  const Y0 = Math.min(...allYears), Y1 = Math.max(...allYears);
  const span = Array.from({ length: Y1 - Y0 + 1 }, (_, k) => Y0 + k);

  function spark(j) {  // tiny per-year sparkline for the list
    const s = document.createElementNS(SVG, "svg"); s.setAttribute("viewBox", `0 0 ${span.length} 10`); s.setAttribute("preserveAspectRatio", "none");
    const max = Math.max(1, ...Object.values(j.years));
    span.forEach((y, k) => { const n = j.years[y] || 0; if (!n) return;
      const r = document.createElementNS(SVG, "rect"); const h = 10 * n / max;
      r.setAttribute("x", k + 0.15); r.setAttribute("width", 0.7); r.setAttribute("y", 10 - h); r.setAttribute("height", h);
      r.setAttribute("fill", "var(--joke)"); r.setAttribute("rx", 0.2); s.append(r); });
    return s;
  }

  const rows = $("rows");
  const buttons = D.jokes.map((j, i) => {
    const b = el("button", "row"); b.style.animationDelay = `${i * 35}ms`; b.setAttribute("role", "option");
    const th = el("div", "th"), img = el("img"); img.loading = "lazy"; img.alt = ""; img.src = `https://i.ytimg.com/vi/${j.i}/mqdefault.jpg`; th.append(img);
    const text = el("div"); text.append(el("div", "t", j.t));
    const n = el("div", "n"); n.append(el("b", null, j.n), document.createTextNode(" times as a joke")); text.append(n);
    b.append(th, text, spark(j));
    b.onclick = () => show(i);
    rows.append(b); return b;
  });

  let cur = -1;
  function show(i) {
    if (i === cur || i < 0 || i >= D.jokes.length) return;
    cur = i; const j = D.jokes[i];
    buttons.forEach((b, k) => { b.classList.toggle("on", k === i); b.setAttribute("aria-selected", k === i); });
    const d = $("detail"); d.replaceChildren();

    const hero = el("div", "hero");
    const shot = el("a", "shot"); shot.href = j.u; shot.target = "_blank"; shot.rel = "noopener";
    const img = el("img"); img.alt = j.t; img.src = `https://i.ytimg.com/vi/${j.i}/hqdefault.jpg`;
    const play = el("span", "play"); play.append(el("span", null, "▶")); shot.append(img, play);
    const info = el("div");
    const years = Object.keys(j.years).map(Number);
    const count = el("div", "count"); count.append(el("b", null, j.n),
      el("span", null, `times posted as a joke${years.length ? `, ${Math.min(...years)}–${Math.max(...years)}` : ""}`));
    info.append(el("div", "rank mono", `RUNNING GAG #${i + 1} OF ${D.jokes.length}`), el("h2", null, j.t), el("div", "c", j.c), count);
    if (j.why) {
      const ai = el("div", "ai"); const k = el("div", "k mono");
      k.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l1.8 5.2L15 7l-5.2 1.8L8 14l-1.8-5.2L1 7l5.2-1.8z"/></svg>';
      k.append(document.createTextNode("THE JOKE · AI NOTE")); ai.append(k, el("div", null, j.why)); info.append(ai);
    }
    hero.append(shot, info);

    const yh = el("div", "sect mono"); yh.append(el("span", null, "WHEN HN POSTS IT AS A JOKE"), el("span", null, "HOVER A BAR"));
    const bars = el("div", "yrs"); const max = Math.max(1, ...Object.values(j.years));
    const every = span.length > 14 ? 3 : span.length > 8 ? 2 : 1;
    span.forEach((y, k) => {
      const n = j.years[y] || 0, col = el("div", "yr"), bar = el("i"), em = el("em", null, n || "");
      col.title = `${y}: ${n} joke post${n === 1 ? "" : "s"}`;
      col.append(bar, em); if (k % every === 0 || k === span.length - 1) col.append(el("span", null, `'${String(y).slice(2)}`));
      bars.append(col);
      setTimeout(() => { bar.style.height = `${100 * n / max}%`; em.style.bottom = `calc(${100 * n / max}% + 2px)`; }, 60 + k * 30);
    });

    const fh = el("div", "sect mono"); fh.append(el("span", null, "IN THE WILD · REAL HN THREADS"), el("span", null, ""));
    const feed = el("div", "feed");
    j.threads.forEach((t, k) => {
      const m = el("div", "msg"); m.style.animationDelay = `${200 + k * 90}ms`;
      const bub = el("div", "bubble");
      const ctx = el("div", "ctx");
      if (t.s) ctx.append(document.createTextNode(`${when(t.m)} · in `), el("b", null, `“${t.s}”`));
      else ctx.append(document.createTextNode(`${when(t.m)} · in an HN thread`));
      const q = el("div", t.q ? "q" : "q none", t.q ? `“${t.q}”` : "Just posted the link, no words needed.");
      const a = el("a", null, "Open the comment on HN ↗"); a.href = t.u; a.target = "_blank"; a.rel = "noopener";
      bub.append(ctx, q, a); m.append(el("div", "ava", "❝"), bub); feed.append(m);
    });
    d.append(hero, yh, bars, fh, feed);
  }
  addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); show(cur + 1); buttons[cur].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); show(cur - 1); buttons[cur].focus(); }
  });
  show(0);

  // Grow the frame (and Streamlit's box around it) to fit, so the page scrolls instead of this box.
  const resize = () => { try { if (frameElement) { const h = document.documentElement.scrollHeight + "px";
    frameElement.style.height = h; frameElement.parentElement.style.height = h; } } catch (e) {} };
  new ResizeObserver(resize).observe(document.body); resize();
})();
</script>
</body>
</html>

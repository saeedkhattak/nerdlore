<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The "Same praise, different reach" pairs. charts.pairs_html fills __DATA__: for each HN recommender count, the most- and least-watched
     video. Only the two raw view counts are shown (no ratios); the meters and the chart draw them on a log scale.
     The "AI note" is HackerTube's LLM-written why_hn text. Thumbnails come from YouTube unaltered. -->
<style>
  :root { --text: #e6edf3; --muted: #8b949e; --line: rgba(255, 255, 255, .08); --panel: rgba(255, 255, 255, .03);
          --panel2: rgba(255, 255, 255, .055); --hn: #ff7a3d; --yt: #3dd6ff; --gem: #a78bfa; --solid: #12161e; }
  body.light { --text: #1f2328; --muted: #57606a; --line: rgba(0, 0, 0, .09); --panel: rgba(0, 0, 0, .025);
               --panel2: rgba(0, 0, 0, .045); --hn: #e8590c; --yt: #0891b2; --gem: #7c3aed; --solid: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 14px/1.45 "Source Sans Pro", "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; }
  button { font: inherit; color: inherit; }
  @keyframes caret { 50% { opacity: 0; } }
  @keyframes materialize { 0% { opacity: 0; filter: blur(8px) saturate(0); transform: translateY(6px) scale(.985); }
                           60% { opacity: 1; filter: blur(0) saturate(1.3); } 100% { opacity: 1; filter: none; transform: none; } }
  @keyframes scan { from { top: -30%; } to { top: 110%; } }
  @keyframes pulse { 50% { opacity: .35; } }

  .stage { position: relative; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
  .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
  .head { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .eyebrow { font-size: 11px; color: var(--hn); display: flex; align-items: center; gap: 8px; }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hn); box-shadow: 0 0 10px var(--hn); animation: pulse 1.8s infinite; }
  .typed { font-size: clamp(17px, 1.9vw, 22px); font-weight: 700; line-height: 1.25; margin-top: 4px; min-height: 2.5em; }
  .typed .c { display: inline-block; width: .55em; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--hn); animation: caret 1s steps(1) infinite; }
  .ctrl { display: flex; gap: 6px; align-items: center; flex: none; }
  .ctrl button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; }
  .ctrl button:hover { border-color: var(--muted); }
  .ctrl .auto { width: auto; padding: 0 10px; position: relative; overflow: hidden; font-size: 12px; }
  .ctrl .auto i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--hn); width: 0; }
  .ctrl .auto[aria-pressed="false"] i { display: none; }

  .duel { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 130px minmax(0, 1fr); align-items: stretch; }
  .side { position: relative; border-radius: 12px; padding: 12px; background: var(--panel2); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .side.hi { --c: var(--yt); } .side.lo { --c: var(--gem); }
  .side { box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent), 0 14px 40px -20px var(--c); }
  .side.anim { animation: materialize .7s cubic-bezier(.2, .7, .2, 1) both; }
  .side.lo.anim { animation-delay: .12s; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--c); margin-bottom: 8px; }
  .tag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .sweep { position: absolute; left: 0; right: 0; height: 30%; top: -30%; pointer-events: none;
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--c) 35%, transparent), transparent); }
  .side.anim .thumb .sweep { animation: scan .9s ease-out .1s; }
  .side h3 { font-size: 16px; line-height: 1.3; margin: 10px 0 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .side .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .views { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .views b { font-size: 26px; font-variant-numeric: tabular-nums; color: var(--c); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 50%, transparent); }
  .views span { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; border-radius: 6px; background: var(--panel); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, transparent, var(--c));
           box-shadow: 0 0 10px var(--c); transition: width 1.1s cubic-bezier(.2, .7, .2, 1); }
  .ai { margin-top: 12px; padding: 9px 11px; border-radius: 9px; border: 1px dashed color-mix(in srgb, var(--c) 45%, transparent);
        background: color-mix(in srgb, var(--c) 6%, transparent); font-size: 13px; min-height: 64px; }
  .ai .k { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--c); margin-bottom: 3px; }
  .ai .k svg { width: 12px; height: 12px; }
  .watch { margin-top: auto; padding-top: 12px; }
  .watch a { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 8px; text-decoration: none; color: inherit;
             border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); font-weight: 600; font-size: 13px; transition: all .2s; }
  .watch a:hover { background: color-mix(in srgb, var(--c) 15%, transparent); box-shadow: 0 0 16px -4px var(--c); }

  .link { position: relative; display: grid; place-items: center; }
  .link canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge { position: relative; z-index: 1; width: 96px; height: 96px; border-radius: 50%; display: grid; place-content: center; text-align: center;
           background: radial-gradient(circle, color-mix(in srgb, var(--hn) 22%, var(--solid)), var(--solid) 72%);
           border: 1px solid color-mix(in srgb, var(--hn) 60%, transparent); box-shadow: 0 0 30px -6px var(--hn); }
  .badge b { font-size: 30px; line-height: 1; color: var(--hn); font-variant-numeric: tabular-nums; }
  .badge span { font-size: 10px; color: var(--muted); line-height: 1.2; margin-top: 3px; }

  .dumb { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 12px 14px 8px; }
  .dumb .t { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .dumb .t .k i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
  #dumb { width: 100%; display: block; cursor: pointer; }
  @media (max-width: 760px) { .duel { grid-template-columns: 1fr; gap: 10px; } .link { height: 110px; } .head { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<section class="stage">
  <div class="head">
    <div>
      <div class="eyebrow mono"><span class="dot"></span><span id="eb"></span></div>
      <div class="typed" id="typed" aria-live="polite"></div>
    </div>
    <div class="ctrl">
      <button id="prev" aria-label="Previous pair">◀</button>
      <button id="next" aria-label="Next pair">▶</button>
      <button class="auto mono" id="auto" aria-pressed="true">AUTO<i id="autoBar"></i></button>
    </div>
  </div>
  <div class="duel">
    <article class="side hi" id="hi"></article>
    <div class="link"><canvas id="link" aria-hidden="true"></canvas><div class="badge"><b id="br"></b><span>HN recommenders<br>each</span></div></div>
    <article class="side lo" id="lo"></article>
  </div>
</section>
<section class="dumb">
  <div class="t"><span class="mono">ALL PAIRS · CLICK A ROW</span>
    <span class="k">least watched<i style="background:var(--gem)"></i>most watched<i style="background:var(--yt)"></i>· YouTube views, log scale</span></div>
  <canvas id="dumb" aria-label="Every pair on one chart"></canvas>
</section>
<template id="card">
  <div class="tag mono"></div>
  <a class="thumb" target="_blank" rel="noopener"><img alt=""><span class="sweep"></span></a>
  <h3></h3>
  <div class="meta"></div>
  <div class="views"><b>0</b><span>YouTube views</span></div>
  <div class="bar"><i></i></div>
  <div class="ai"><div class="k mono"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l1.8 5.2L15 7l-5.2 1.8L8 14l-1.8-5.2L1 7l5.2-1.8z"/></svg>AI NOTE · WHY HN RECOMMENDS IT</div><span class="txt"></span></div>
  <div class="watch"><a target="_blank" rel="noopener">▶ Watch on YouTube</a></div>
</template>
<script>
(() => {
  const D = __DATA__;
  try {
    const app = parent.document.querySelector(".stApp") || parent.document.body;
    const [r, g, b] = getComputedStyle(app).backgroundColor.match(/\d+/g).map(Number);
    document.body.classList.toggle("light", 0.299 * r + 0.587 * g + 0.114 * b > 140);
  } catch (e) {}
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
  const C = { hn: css("--hn"), yt: css("--yt"), gem: css("--gem"), muted: css("--muted"), line: css("--line"), text: css("--text") };
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  const fmt = n => n.toLocaleString("en-US");
  const $ = id => document.getElementById(id);
  const P = D.pairs;
  const allViews = P.flatMap(p => [p.hi.v, p.lo.v]).map(v => Math.max(1, v));
  const L0 = Math.floor(Math.log10(Math.min(...allViews))), L1 = Math.ceil(Math.log10(Math.max(...allViews)));
  const logPct = v => 100 * (Math.log10(Math.max(1, v)) - L0) / Math.max(1, L1 - L0);

  /* ---------- typewriter ---------- */
  let typeToken = 0;
  function typeInto(node, text, speed, withCaret) {
    const token = ++typeToken; node.textContent = "";
    if (reduce) { node.textContent = text; return; }
    const caret = document.createElement("span"); caret.className = "c";
    let i = 0;
    const step = () => {
      if (token !== typeToken && withCaret) return;
      node.textContent = text.slice(0, i); if (withCaret) node.append(caret);
      if (i++ < text.length) setTimeout(step, speed + Math.random() * speed);
    };
    step();
  }
  function typeNote(node, text) {  // independent typewriters for the two AI notes
    if (reduce) { node.textContent = text; return; }
    const id = (node.dataset.t = (+node.dataset.t || 0) + 1); let i = 0;
    const step = () => { if (+node.dataset.t !== id) return; node.textContent = text.slice(0, i); if (i++ < text.length) setTimeout(step, 9); };
    setTimeout(step, 350);
  }
  function countUp(node, to) {
    if (reduce) { node.textContent = fmt(to); return; }
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - k, 3);
      node.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  /* ---------- the duel ---------- */
  function fill(el, v, label) {
    el.replaceChildren(document.getElementById("card").content.cloneNode(true));
    el.querySelector(".tag").textContent = label;
    el.querySelector(".thumb").href = v.u; el.querySelector(".watch a").href = v.u;
    const img = el.querySelector("img"); img.src = `https://i.ytimg.com/vi/${v.i}/hqdefault.jpg`; img.alt = v.t;
    el.querySelector("h3").textContent = v.t;
    el.querySelector(".meta").textContent = [v.c, v.type, v.year ? `uploaded ${v.year}` : null].filter(Boolean).join(" · ");
    countUp(el.querySelector(".views b"), v.v);
    requestAnimationFrame(() => requestAnimationFrame(() => { el.querySelector(".bar i").style.width = Math.max(3, logPct(v.v)) + "%"; }));
    const note = el.querySelector(".txt");
    if (v.why) typeNote(note, v.why); else el.querySelector(".ai").style.display = "none";
    el.classList.remove("anim"); void el.offsetWidth; el.classList.add("anim");
  }
  let cur = 0;
  function show(i) {
    cur = (i + P.length) % P.length; const p = P[cur];
    $("eb").textContent = `PAIR ${cur + 1} OF ${P.length} · SAME HN LOVE, DIFFERENT AUDIENCES`;
    $("br").textContent = p.r;
    typeInto($("typed"), `Both recommended by ${p.r} people on Hacker News. One has ${fmt(p.hi.v)} YouTube views, the other ${fmt(p.lo.v)}.`, 14, true);
    fill($("hi"), p.hi, "MOST WATCHED");
    fill($("lo"), p.lo, "LEAST WATCHED");
    burst = 1;
    if (reduce && dctx) { drawLink(16); drawDumb(0); }
  }

  /* ---------- auto-play ---------- */
  const AUTO_MS = 9000; let auto = !reduce && P.length > 1, autoT = 0;
  const autoBtn = $("auto");
  const setAuto = on => { auto = on; autoBtn.setAttribute("aria-pressed", on); autoT = 0; };
  setAuto(auto);
  autoBtn.onclick = () => setAuto(!auto);
  $("prev").onclick = () => { setAuto(false); show(cur - 1); };
  $("next").onclick = () => { setAuto(false); show(cur + 1); };
  addEventListener("keydown", e => { if (e.key === "ArrowLeft") $("prev").click(); if (e.key === "ArrowRight") $("next").click(); });
  document.querySelector(".stage").addEventListener("mouseenter", () => { paused = true; });
  document.querySelector(".stage").addEventListener("mouseleave", () => { paused = false; });
  let paused = false;

  /* ---------- link: HN signal flowing out to both videos ---------- */
  const link = $("link"); let LW = 0, LH = 0, lctx, sparks = [], burst = 1;
  function fitCanvas(cv, h) {
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    const H = h || r.height; cv.width = r.width * dpr; cv.height = H * dpr; if (h) cv.style.height = h + "px";
    const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return [ctx, r.width, H];
  }
  function drawLink(dt) {
    if (!lctx) return;
    lctx.clearRect(0, 0, LW, LH);
    const vertical = LW > LH;  // narrow screens stack the cards, so the signal flows up and down
    const cx = LW / 2, cy = LH / 2;
    const spawn = 1 + burst * 3;
    for (let k = 0; k < spawn; k++) if (Math.random() < 0.5) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      sparks.push({ t: 0, dir, off: (Math.random() - 0.5) * 50, sp: 0.008 + Math.random() * 0.01 });
    }
    burst *= 0.96;
    for (const s of sparks) {
      s.t += s.sp * (dt / 16);
      const e = s.t, x = vertical ? cx + s.off * (1 - e) : cx + s.dir * e * (LW / 2), y = vertical ? cy + s.dir * e * (LH / 2) : cy + s.off * Math.sin(e * Math.PI) * 0.6;
      const col = e < 0.5 ? C.hn : (s.dir < 0 ? C.yt : C.gem);
      lctx.fillStyle = rgba(col, 1 - e * 0.7); lctx.beginPath(); lctx.arc(x, y, 1.8, 0, 6.283); lctx.fill();
    }
    sparks = sparks.filter(s => s.t < 1);
    // rails
    for (const dir of [-1, 1]) {
      const ex = vertical ? cx : cx + dir * LW / 2, ey = vertical ? cy + dir * LH / 2 : cy;
      const g = lctx.createLinearGradient(cx, cy, ex, ey);
      g.addColorStop(0, rgba(C.hn, 0.6)); g.addColorStop(1, rgba(dir < 0 ? C.yt : C.gem, 0.6));
      lctx.strokeStyle = g; lctx.lineWidth = 1; lctx.setLineDash([3, 5]); lctx.beginPath();
      lctx.moveTo(cx, cy); lctx.lineTo(ex, ey); lctx.stroke(); lctx.setLineDash([]);
    }
  }

  /* ---------- dumbbell chart of every pair ---------- */
  const dumb = $("dumb"), ROW = 26, PAD = { l: 44, r: 16, t: 6, b: 26 };
  let dctx, DW = 0, DH = 0, hoverRow = -1, drawn = 0;
  const X = v => PAD.l + (Math.log10(Math.max(1, v)) - L0) / Math.max(1, L1 - L0) * (DW - PAD.l - PAD.r);
  function drawDumb(t) {
    if (!dctx) return;
    dctx.clearRect(0, 0, DW, DH);
    drawn = Math.min(1, drawn + 0.03);
    dctx.font = "11px system-ui, sans-serif"; dctx.textAlign = "center";
    for (let p = L0; p <= L1; p++) {
      const x = X(Math.pow(10, p)); dctx.strokeStyle = C.line; dctx.beginPath(); dctx.moveTo(x, PAD.t); dctx.lineTo(x, DH - PAD.b); dctx.stroke();
      dctx.fillStyle = C.muted;
      dctx.fillText(p >= 9 ? `${10 ** (p - 9)}B` : p >= 6 ? `${10 ** (p - 6)}M` : p >= 3 ? `${10 ** (p - 3)}k` : `${10 ** p}`, x, DH - 8);
    }
    P.forEach((p, i) => {
      const y = PAD.t + i * ROW + ROW / 2, on = i === cur, hov = i === hoverRow;
      if (on || hov) { dctx.fillStyle = rgba(C.hn, on ? 0.12 : 0.06); dctx.fillRect(0, y - ROW / 2 + 2, DW, ROW - 4); }
      dctx.textAlign = "right"; dctx.fillStyle = on ? C.hn : C.muted; dctx.font = `${on ? "700 " : ""}12px system-ui, sans-serif`;
      dctx.fillText(p.r, PAD.l - 12, y + 4);
      const a = X(p.lo.v), b = X(p.hi.v), mid = (a + b) / 2, k = reduce ? 1 : 1 - Math.pow(1 - drawn, 3);
      const xa = mid + (a - mid) * k, xb = mid + (b - mid) * k;
      const g = dctx.createLinearGradient(xa, 0, xb, 0); g.addColorStop(0, rgba(C.gem, on ? 1 : 0.55)); g.addColorStop(1, rgba(C.yt, on ? 1 : 0.55));
      dctx.strokeStyle = g; dctx.lineWidth = on ? 3 : 2; dctx.beginPath(); dctx.moveTo(xa, y); dctx.lineTo(xb, y); dctx.stroke();
      if (on && !reduce) {  // a pulse travelling along the active pair line
        const f = (t / 1400) % 1; dctx.fillStyle = rgba(C.hn, 1 - f * 0.5);
        dctx.beginPath(); dctx.arc(xa + (xb - xa) * f, y, 3, 0, 6.283); dctx.fill();
      }
      for (const [x, c] of [[xa, C.gem], [xb, C.yt]]) {
        dctx.shadowColor = c; dctx.shadowBlur = on ? 14 : 0; dctx.fillStyle = c;
        dctx.beginPath(); dctx.arc(x, y, on ? 6 : 4.5, 0, 6.283); dctx.fill(); dctx.shadowBlur = 0;
      }
    });
  }
  dumb.addEventListener("mousemove", e => { const r = dumb.getBoundingClientRect(); const i = Math.floor((e.clientY - r.top - PAD.t) / ROW); hoverRow = i >= 0 && i < P.length ? i : -1; });
  dumb.addEventListener("mouseleave", () => { hoverRow = -1; });
  dumb.addEventListener("click", () => { if (hoverRow >= 0) { setAuto(false); show(hoverRow); } });

  /* ---------- loop ---------- */
  function layout() {
    [lctx, LW, LH] = fitCanvas(link);
    [dctx, DW, DH] = fitCanvas(dumb, PAD.t + P.length * ROW + PAD.b);
    // Grow the frame (and Streamlit's box around it) to fit, so the page scrolls instead of this box.
    try { if (frameElement) { const h = document.documentElement.scrollHeight + "px"; frameElement.style.height = h; frameElement.parentElement.style.height = h; } } catch (e) {}
  }
  new ResizeObserver(layout).observe(document.body);
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(50, t - last); last = t;
    if (auto && !paused) { autoT += dt; if (autoT >= AUTO_MS) { autoT = 0; show(cur + 1); } }
    $("autoBar").style.width = `${100 * autoT / AUTO_MS}%`;
    drawLink(dt); drawDumb(t);
    requestAnimationFrame(frame);
  }
  layout(); show(0);
  if (reduce) { drawLink(16); drawDumb(0); } else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
